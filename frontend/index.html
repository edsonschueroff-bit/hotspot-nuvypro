  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#2563eb" />
  
  <!-- Apple / iOS PWA Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Nuvy Pro" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

  <!-- Open Graph / Facebook / WhatsApp -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://hotspot.nuvycore.online/" />
  <meta property="og:site_name" content="Nuvy Pro" />
  <meta property="og:title" content="Nuvy Pro — Gestão Inteligente de Wi-Fi, Marketing & Clientes" />
  <meta property="og:description" content="Plataforma completa de gestão de Hotspot Wi-Fi corporativo, autenticação RADIUS, conformidade LGPD e CRM integrado." />
  <meta property="og:image" content="https://hotspot.nuvycore.online/og-preview.png" />
  <meta property="og:image:secure_url" content="https://hotspot.nuvycore.online/og-preview.png" />

  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Nuvy Pro — Gestão Inteligente de Wi-Fi, Marketing & Clientes" />
  <meta name="twitter:description" content="Plataforma completa de gestão de Hotspot Wi-Fi corporativo, autenticação RADIUS, conformidade LGPD e CRM integrado." />

  <title>Nuvy Pro - Gestão Inteligente de Wi-Fi, Marketing & Fidelização</title>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then((reg) => console.log('[PWA] Service Worker registrado com sucesso! Escopo:', reg.scope))
          .catch((err) => console.warn('[PWA] Falha ao registrar Service Worker:', err.message));
      });
    }
  </script>
</body>

</html>
